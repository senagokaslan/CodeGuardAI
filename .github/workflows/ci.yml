name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Restore, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.103"

      - name: Restore
        run: dotnet restore CodeGuardAI.sln

      - name: Build
        run: dotnet build CodeGuardAI.sln --configuration Release --no-restore

      - name: Run unit and eval tests
        run: dotnet test tests/CodeGuardAI.UnitTests --configuration Release --no-build --filter "Category!=Database"

      - name: Run offline API tests
        run: dotnet test tests/CodeGuardAI.IntegrationTests --configuration Release --no-build --filter "Category!=Database"
